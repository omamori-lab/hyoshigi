name: Docs

# Builds the documentation site with MkDocs and deploys it to GitHub Pages, on
# every push to main and when run by hand. CI builds the same site with
# --strict on every pull request, so a broken page fails there first.
#
# It needs GitHub Pages enabled with "GitHub Actions" as the source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: a queued run gives way to a newer one, and a running one is never cancelled,
# so an older build cannot deploy after a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mkdocs-bibtex formats citations with Pandoc, and refuses one older than 2.11.
      # A pinned Pandoc release from GitHub, checked against the SHA-256 on its release
      # page, so the install depends on neither Ubuntu's mirror nor the runner image.
      - name: Install Pandoc
        run: |
          curl -sSfL -o "$RUNNER_TEMP/pandoc.tar.gz" https://github.com/jgm/pandoc/releases/download/3.13/pandoc-3.13-linux-amd64.tar.gz
          echo "38aa33b325a2bc96a4c39409631212db55702f564250bcdbead180b3bf646389  $RUNNER_TEMP/pandoc.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP" pandoc-3.13/bin/pandoc
          echo "$RUNNER_TEMP/pandoc-3.13/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      # mkdocstrings reads src/ without importing it, so the docs group is all the build needs.
      - name: Install dependencies
        run: uv sync --locked --only-group docs

      - name: Build the site
        run: uv run --no-sync mkdocs build --strict --site-dir site

      - name: Keep the site for deployment
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
