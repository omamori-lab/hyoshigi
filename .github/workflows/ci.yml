name: CI

# Runs scripts/check.sh, the one gate script, on every pull request and on pushes
# to main, across the supported Python versions, runs the test suite at the
# lowest versions pyproject.toml allows, and scans the whole history for secrets.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev --group docs

      # The docs build formats citations with Pandoc 2.11 or newer, which the gate checks.
      # A pinned Pandoc release from GitHub, checked against the SHA-256 on its release
      # page, so the install depends on neither Ubuntu's mirror nor the runner image.
      - name: Install Pandoc
        run: |
          curl -sSfL -o "$RUNNER_TEMP/pandoc.tar.gz" https://github.com/jgm/pandoc/releases/download/3.13/pandoc-3.13-linux-amd64.tar.gz
          echo "38aa33b325a2bc96a4c39409631212db55702f564250bcdbead180b3bf646389  $RUNNER_TEMP/pandoc.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP" pandoc-3.13/bin/pandoc
          echo "$RUNNER_TEMP/pandoc-3.13/bin" >> "$GITHUB_PATH"

      - name: Run every gate
        run: scripts/check.sh

  lowest-versions:
    # The lock file pins the newest versions, so the gates never see the lower
    # bounds in pyproject.toml. This job resolves every direct dependency to the
    # lowest version its bound allows and runs the test suite there, without the
    # docs site tests, which need the docs group and Pandoc.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_RESOLUTION: lowest-direct
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      # The dev group installs hyoshigi with every extra.
      - name: Install the lowest direct versions
        run: uv sync --group dev

      - name: Run the test suite
        run: uv run --no-sync pytest -q --ignore=tests/docs/test_site.py

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository, with its whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pinned gitleaks release, checked against its published SHA-256, so
      # no third-party action or image runs with the repository's token.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan the history for secrets
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --no-banner
