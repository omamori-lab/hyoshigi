# Dependabot opens a weekly pull request for each ecosystem. CI checks it like
# any other pull request. github-actions keeps the workflows' pinned actions
# current; uv keeps uv.lock current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
