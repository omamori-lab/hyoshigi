<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="498" viewBox="0 0 1000 498" role="img" aria-labelledby="title desc">
  <title id="title">What a monitor reads by default</title>
  <desc id="desc">Every entry of a trajectory belongs to one Channel. A monitor reads the trajectory through its view, View() by default, whose channels are Channel.DEFAULT: TASK, the messages from the user or the delegator; TOOL_CALLS, tool calls and tool errors; and SUBAGENT_REPORTS, the results of the calls passed to Trajectory.delegate or made with the delegation_tools, which are none by default. It leaves out CONTEXT, context notes from other authors; THOUGHTS, the agent&#x27;s thoughts; AGENT_PARTS, what the agent said earlier; and TOOL_OBSERVATIONS, raw tool results. Each channel left out is one flag away. The rated action&#x27;s parts and tool calls are read whatever the view, and its thought when the view reads THOUGHTS.</desc>
  <!-- Colours come from the brand tokens: diagrams/render.py fills this style block. -->
  <style>
    svg { color-scheme: dark; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans JP", Helvetica, Arial, sans-serif; font-size: 15px; fill: #ECEBE6; }
    .title { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; fill: #A9A8A2; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .soft { fill: #A9A8A2; }
    .dashed { stroke-dasharray: 5 4; fill: none; stroke: #6A6A66; }
    .box { fill: #141414; stroke: #ECEBE6; stroke-width: 1.4; }
    .charm { fill: #ECEBE6; }
    .on-charm { fill: #111111; }
    .charm-cord { fill: none; stroke: #ECEBE6; stroke-width: 2.2; }
    .seal { fill: #E0563B; }
    .allow { fill: #141414; stroke: #ECEBE6; stroke-width: 1.4; }
    .resample { fill: #1F1F1E; stroke: #ECEBE6; stroke-width: 1.4; }
    .defer { fill: #34332F; stroke: #ECEBE6; stroke-width: 1.4; }
    .steer { fill: #D9D8D2; stroke: #D9D8D2; stroke-width: 1.4; }
    .on-steer { fill: #111111; }
    .halt { fill: #E0563B; stroke: #E0563B; stroke-width: 1.4; }
    .on-halt { fill: #111111; }
    .frame { fill: none; stroke: #6A6A66; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: #D6D5CF; stroke-width: 1.5; }
    .loop { fill: none; stroke: #D6D5CF; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .bold { stroke-width: 2.75; }
    .lifeline { fill: none; stroke: #A9A8A2; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .head { fill: #D6D5CF; }
    .brush { fill: #ECEBE6; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
  <text x="32.0" y="44.0" text-anchor="start"><tspan class="title">What a monitor reads by default</tspan></text>
  <text x="32.0" y="96.0" text-anchor="start"><tspan class="small">read by default, </tspan><tspan class="mono">Channel.DEFAULT</tspan></text>
  <rect class="box" x="32.0" y="112.0" width="580.0" height="34" rx="6"/>
  <text x="52.0" y="134.0" text-anchor="start" class="mono">TASK</text>
  <text x="212.0" y="134.0" text-anchor="start" class="small">messages from the user or delegator</text>
  <rect class="box" x="32.0" y="158.0" width="580.0" height="34" rx="6"/>
  <text x="52.0" y="180.0" text-anchor="start" class="mono">TOOL_CALLS</text>
  <text x="212.0" y="180.0" text-anchor="start" class="small">tool calls, and tool errors</text>
  <rect class="box" x="32.0" y="204.0" width="580.0" height="34" rx="6"/>
  <text x="52.0" y="226.0" text-anchor="start" class="mono">SUBAGENT_REPORTS</text>
  <text x="212.0" y="226.0" text-anchor="start"><tspan class="small">results of </tspan><tspan class="mono">delegate</tspan><tspan class="small"> calls or </tspan><tspan class="mono">delegation_tools</tspan></text>
  <text x="32.0" y="278.0" text-anchor="start" class="small">left out by default, each one flag away</text>
  <rect class="box dashed" x="32.0" y="294.0" width="580.0" height="34" rx="6"/>
  <text x="52.0" y="316.0" text-anchor="start" class="mono soft">CONTEXT</text>
  <text x="212.0" y="316.0" text-anchor="start" class="small">context notes from other authors</text>
  <rect class="box dashed" x="32.0" y="340.0" width="580.0" height="34" rx="6"/>
  <text x="52.0" y="362.0" text-anchor="start" class="mono soft">THOUGHTS</text>
  <text x="212.0" y="362.0" text-anchor="start" class="small">the agent&#x27;s thoughts</text>
  <rect class="box dashed" x="32.0" y="386.0" width="580.0" height="34" rx="6"/>
  <text x="52.0" y="408.0" text-anchor="start" class="mono soft">AGENT_PARTS</text>
  <text x="212.0" y="408.0" text-anchor="start" class="small">what the agent said earlier</text>
  <rect class="box dashed" x="32.0" y="432.0" width="580.0" height="34" rx="6"/>
  <text x="52.0" y="454.0" text-anchor="start" class="mono soft">TOOL_OBSERVATIONS</text>
  <text x="212.0" y="454.0" text-anchor="start" class="small">raw tool results</text>
  <path class="charm-cord" d="M822.0,125.0 C818.0,108.0 838.0,108.0 834.0,125.0"/>
  <path class="charm" d="M704.0,124.0 H952.0 L968.0,140.0 V220.0 Q968.0,226.0 962.0,226.0 H694.0 Q688.0,226.0 688.0,220.0 V140.0 Z"/>
  <rect class="seal" x="697.0" y="208.0" width="9" height="9" rx="1"/>
  <text x="828.0" y="155.0" text-anchor="middle" class="title on-charm">Monitor</text>
  <text x="828.0" y="177.0" text-anchor="middle" class="small on-charm">reads the trajectory through</text>
  <text x="828.0" y="198.0" text-anchor="middle"><tspan class="small on-charm">its </tspan><tspan class="mono on-charm">view</tspan><tspan class="small on-charm">, </tspan><tspan class="mono on-charm">View()</tspan><tspan class="small on-charm"> by default</tspan></text>
  <path class="edge bold" d="M650.0,129.0 L650.0,221.0"/>
  <path class="edge bold" d="M612.0,129.0 L650.0,129.0"/>
  <path class="edge bold" d="M612.0,175.0 L650.0,175.0"/>
  <path class="edge bold" d="M612.0,221.0 L650.0,221.0"/>
  <path class="edge bold" d="M650.0,175.0 L686.0,175.0" marker-end="url(#arrow)"/>
  <rect class="box" x="688.0" y="290.0" width="280.0" height="102.0" rx="6"/>
  <text x="828.0" y="321.0" text-anchor="middle" class="title">The rated action</text>
  <text x="828.0" y="343.0" text-anchor="middle" class="small">its parts and tool calls, always;</text>
  <text x="828.0" y="364.0" text-anchor="middle"><tspan class="small">its thought with </tspan><tspan class="mono">THOUGHTS</tspan></text>
  <path class="edge" d="M828.0,290.0 L828.0,228.0" marker-end="url(#arrow)"/>
</svg>
