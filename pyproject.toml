[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "hyoshigi"
dynamic = ["version"]
description = "AI-control monitors without a framework: each action an agent proposes is rated against its trajectory before it runs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Badilla-Olivas", email = "omamori-lab@proton.me" }]
keywords = [
    "ai-safety",
    "ai-control",
    "ai-agents",
    "llm-agents",
    "agent-safety",
    "monitoring",
    "guardrails",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]
# The core runs on the standard library alone.
dependencies = []

[project.urls]
Repository = "https://github.com/omamori-lab/hyoshigi"
Issues = "https://github.com/omamori-lab/hyoshigi/issues"
Changelog = "https://github.com/omamori-lab/hyoshigi/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]

[tool.hatch.version]
path = "src/hyoshigi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hyoshigi"]

[tool.hatch.build.targets.sdist]
# An explicit list, because hatchling ships every file .gitignore does not
# exclude, tracked or not.
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C90", "ANN", "PT", "RUF", "COM"]
ignore = ["COM812"]

[tool.ruff.lint.mccabe]
# The highest complexity lanorme's complexity_error allows, so tests, which lanorme skips,
# keep to the same number.
max-complexity = 6

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true

# The limits below are a ratchet: lower them as the code allows, and raise one only in a
# reviewed change that says why.
[tool.lanorme]
# Each checkout is its own project, so an agent worktree is not checked through the main one.
root = true
# Hexagonal-architecture rules: hyoshigi is not layered that way.
# AAA-001 asks for "# Arrange" comments; AGENTS.md separates the three parts by blank lines.
ignore = ["LAYER", "PORT", "AAA-001"]
promote = ["NAMING-006", "NAMING-007", "NAMING-008", "NAMING-011", "SIMILAR-001"]
exclude = [
    ".venv/*",
    ".claude/worktrees",
    ".claude/worktrees/*",
    "dist/*",
    # Local design notes, which git ignores and lanorme does not.
    "docs/plans/*",
]

[tool.lanorme.file_limits]
func_warn_lines = 40
func_error_lines = 60
complexity_warn = 6
complexity_error = 7
param_warn = 5
param_error = 8

[tool.lanorme.prose]
enabled = true

[tool.lanorme.comments]
em_dash = true
emoji = true

[tool.lanorme.named_args]
enabled = true

[tool.lanorme.test_style]
enabled = true

[tool.lanorme.attribute_access]
enabled = true

[tool.lanorme.naming_clean_code]
enabled = true

[tool.lanorme.similarity]
enabled = true

# Each inline ignore of a lanorme rule counts, as `# lanorme: ignore[...]` or `# noqa`.
[tool.lanorme.suppressions]
enabled = true
max_total = 10

[tool.lanorme.docstrings]
enabled = true
