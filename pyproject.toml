[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "hyoshigi"
dynamic = ["version"]
description = "AI-control monitors without a framework: each action an agent proposes is rated against its trajectory before it runs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Badilla-Olivas", email = "omamori-lab@proton.me" }]
keywords = [
    "ai-safety",
    "ai-control",
    "ai-agents",
    "llm-agents",
    "agent-safety",
    "monitoring",
    "guardrails",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]
# The core runs on the standard library alone.
dependencies = []

[project.optional-dependencies]
# Each provider adapter brings its own SDK; the core needs none of them.
openai = ["openai>=3.33.0"]
anthropic = ["anthropic>=1.15.0"]
openrouter = ["openrouter>=1.3.63"]
typesafe = ["typesafe-sdk>=0.7.5"]
opentelemetry = ["opentelemetry-api>=1.45.1"]
langfuse = ["langfuse>=5.0.2"]
langsmith = ["langsmith>=0.14.11"]

[project.urls]
Repository = "https://github.com/omamori-lab/hyoshigi"
Issues = "https://github.com/omamori-lab/hyoshigi/issues"
Changelog = "https://github.com/omamori-lab/hyoshigi/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "hyoshigi[openai,anthropic,openrouter,typesafe,opentelemetry,langfuse,langsmith]",
    "bibtexparser>=2.1.0",
    "hypothesis>=6.170.1",
    "mutmut>=3.8.0",
    "opentelemetry-sdk>=1.45.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.8",
    "mkdocs-bibtex>=4.4.0",
]

[tool.hatch.version]
path = "src/hyoshigi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hyoshigi"]

[tool.hatch.build.targets.sdist]
# An explicit list, because hatchling ships every file .gitignore does not
# exclude, tracked or not.
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C90", "ANN", "PT", "RUF", "COM"]

[tool.ruff.lint.mccabe]
# The highest complexity lanorme's complexity_error allows, so tests, which lanorme skips,
# keep to the same number.
max-complexity = 6

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true

[tool.mutmut]
# The domain is mutation-tested: no surviving mutant is left unexplained.
paths_to_mutate = ["src/hyoshigi/"]
tests_dir = ["tests/"]
# mutmut runs each function through its trampoline, which adds stack frames, so the line a
# warning points at cannot be checked in its runs. Its copy of the project holds no docs/, which
# the docs tests read and build.
pytest_add_cli_args = [
    "--deselect",
    "tests/monitors/test_guard.py::test_the_one_sample_warning_points_at_the_line_that_builds_the_monitor",
    "--ignore",
    "tests/docs",
]

# The limits below are a ratchet: lower them as the code allows, and raise one only in a
# reviewed change that says why.
[tool.lanorme]
# Each checkout is its own project, so an agent worktree is not checked through the main one.
root = true
# Hexagonal-architecture rules: hyoshigi is not layered that way.
# AAA-001 asks for "# Arrange" comments; AGENTS.md separates the three parts by blank lines.
# DOCS-003 asks each page to open with "This page" or the like; no page talks about itself.
ignore = ["LAYER", "PORT", "AAA-001", "DOCS-003"]
promote = ["NAMING-006", "NAMING-007", "NAMING-008", "NAMING-011", "SIMILAR-001"]
exclude = [
    ".venv/*",
    ".claude/worktrees",
    ".claude/worktrees/*",
    "dist/*",
    # mutmut's working copy, and the local design notes: git ignores both, lanorme does not.
    "mutants/*",
    "docs/plans/*",
]

# Each model adapter's SDK, OpenTelemetry and each observability SDK are optional extras, so
# these modules import them where they are used, not at the top.
[tool.lanorme.per-file-ignores]
"src/hyoshigi/models/model.py" = ["IMPORT-001"]
"src/hyoshigi/monitors/tracing.py" = ["IMPORT-001"]
"src/hyoshigi/monitors/reports.py" = ["IMPORT-001"]
"src/hyoshigi/monitors/reporting.py" = ["IMPORT-001"]

[tool.lanorme.file_limits]
# Code with two or more items in a call or collection takes one item per line, so the line
# limits count those spread lines.
file_warn_lines = 450
file_error_lines = 750
func_warn_lines = 60
func_error_lines = 90
complexity_warn = 6
complexity_error = 7
param_warn = 5
param_error = 8

[tool.lanorme.prose]
enabled = true

# The Diataxis structure of docs/: a page lives in tutorials, how-to, reference or explanation,
# or is one of the top-level pages listed here.
[tool.lanorme.docs]
enabled = true
known_top_level = ["index.md", "name.md"]

[tool.lanorme.comments]
em_dash = true
emoji = true

[tool.lanorme.named_args]
enabled = true

[tool.lanorme.test_style]
enabled = true

[tool.lanorme.attribute_access]
enabled = true

# Reinforcement learning's verb: an agent acts and observes.
[tool.lanorme.naming_canon]
verbs = ["act", "drive"]

[tool.lanorme.naming_clean_code]
enabled = true
verbs = ["act", "drive"]
# A strategy passed as a value is named for what it decides.
exempt = ["by_role"]

[tool.lanorme.similarity]
enabled = true

# Each inline ignore of a lanorme rule counts, as `# lanorme: ignore[...]` or `# noqa`.
[tool.lanorme.suppressions]
enabled = true
max_total = 10

[tool.lanorme.docstrings]
enabled = true
